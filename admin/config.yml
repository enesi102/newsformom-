backend:
  name: git-gateway
  branch: main

media_folder: "news/images"
public_folder: "/news/images"

locale: "ro"

collections:

  # =========================
  # ȘTIRI
  # =========================

  - name: "news"
    label: "Știri"
    label_singular: "Știre"
    folder: "news"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields:
      fields:
        - "date"
        - "title"

    fields:

      - label: "Titlu"
        name: "title"
        widget: "string"

      - label: "Data și ora publicării"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD.MM.YYYY"
        time_format: "HH:mm"

      - label: "Categorie"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields:
          - "name"
          - "description"
        value_field: "slug"
        display_fields:
          - "name"
        options_length: 50

      - label: "Imagine principală"
        name: "image"
        widget: "image"
        required: false

      - label: "Cuvinte cheie"
        name: "tags"
        widget: "list"
        required: false
        field:
          label: "Cuvânt cheie"
          name: "tag"
          widget: "string"

      - label: "Conținut"
        name: "body"
        widget: "markdown"
        buttons:
          - bold
          - italic
          - link
          - bulleted-list
          - numbered-list
          - quote
          - heading-two
          - heading-three

      - label: "Galerie foto"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Fotografie"
          name: "image"
          widget: "image"

      - label: "Link articol original"
        name: "source_url"
        widget: "string"
        required: false


  # =========================
  # CATEGORII
  # =========================

  - name: "categories"
    label: "Categorii"
    label_singular: "Categorie"
    folder: "categories"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"

    fields:

      - label: "Nume categorie"
        name: "name"
        widget: "string"

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Folosește litere mici și fără spații. Exemplu: construim"

      - label: "Icon"
        name: "icon"
        widget: "string"
        required: false
        hint: "Exemplu: 🏗️"

      - label: "Definiție"
        name: "description"
        widget: "text"
        hint: "Explică exact ce tip de știri aparține acestei categorii."

  # =========================
  # PAGINI
  # =========================

  - name: "pages"
    label: "Pagini"
    files:

      - label: "Despre NewsForMom"
        name: "about"
        file: "content/about.json"
        fields:
          - label: "Titlu"
            name: "title"
            widget: "string"

          - label: "Misiunea NewsForMom"
            name: "body"
            widget: "markdown"

      - label: "Contact"
        name: "contact"
        file: "content/contact.json"
        fields:
          - label: "Email"
            name: "email"
            widget: "string"

          - label: "Text"
            name: "body"
            widget: "markdown"
