backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "stiri"
    label: "Știri"
    folder: "stiri"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Titlu", name: "title", widget: "string"}
      - {label: "Data Publicării (Selectată de tine)", name: "date", widget: "date", format: "YYYY-MM-DD"}
      - {label: "Categorie", name: "category", widget: "select", options: ["construim", "invatam", "cercetam"]}
      - {label: "Etichete (separate prin virgula)", name: "tags", widget: "list"}
      - {label: "Rezumat (Idei principale)", name: "body", widget: "markdown"}
      - {label: "Link Articol Original", name: "source_url", widget: "string"}
