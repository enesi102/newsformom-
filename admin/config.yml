backend:
  name: git-gateway
  branch: main

locale: ro

media_folder: "media"
public_folder: "/media"

site_url: "/"

collections:

  - name: "site"
    label: "Site banner"
    files:
      - label: "Site banner"
        name: "banner"
        file: "content/site/settings.json"
        fields:
          - { label: "Banner activ", name: "banner_enabled", widget: "boolean", default: true }
          - { label: "Titlu banner", name: "banner_title", widget: "string" }
          - { label: "Text banner", name: "banner_text", widget: "string" }
          - { label: "Icon", name: "banner_icon", widget: "string", required: false }

  - name: "articles"
    label: "Articles"
    folder: "news"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Titlu", name: "title", widget: "string" }
      - { label: "Data publicării", name: "date", widget: "datetime", format: "YYYY-MM-DDTHH:mm:ssZ" }

      - label: "Categorie"
        name: "category"
        widget: "relation"
        collection: "categories"
        search_fields: ["name", "slug"]
        value_field: "slug"
        display_fields: ["name"]

      - { label: "Imagine principală", name: "hero_image", widget: "image", required: false, choose_url: false, media_folder: "/media/news", public_folder: "/media/news" }
      - { label: "Descriere imagine principală", name: "hero_caption", widget: "string", required: false }

      - label: "Cuvinte cheie"
        name: "tags"
        widget: "list"
        required: false
        field:
          { label: "Cuvânt cheie", name: "tag", widget: "string" }

      - label: "Conținut"
        name: "body"
        widget: "richtext"
        buttons:
          - bold
          - italic
          - link
          - heading-two
          - heading-three
          - quote
          - bulleted-list
          - numbered-list
        editor_components:
          - image
          - article-image

      - label: "Galerie foto"
        name: "gallery"
        widget: "list"
        required: false
        fields:
          - { label: "Fotografie", name: "image", widget: "image", choose_url: false, media_folder: "/media/news", public_folder: "/media/news" }
          - { label: "Descriere", name: "caption", widget: "string", required: false }

      - { label: "Link articol original", name: "source_url", widget: "string", required: false }

  - name: "categories"
    label: "Categories"
    folder: "content/categories"
    create: true
    extension: "json"
    format: "json"
    slug: "{{slug}}"
    fields:
      - { label: "Nume categorie", name: "name", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Icon", name: "icon", widget: "string", required: false }
      - { label: "Definiție", name: "description", widget: "text" }

  - name: "pages"
    label: "Pages"
    files:
      - label: "About"
        name: "about"
        file: "content/pages/about.json"
        fields:
          - { label: "Titlu", name: "title", widget: "string" }
          - { label: "Conținut", name: "body", widget: "richtext" }

      - label: "Contact"
        name: "contact"
        file: "content/pages/contact.json"
        fields:
          - { label: "Titlu", name: "title", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Conținut", name: "body", widget: "richtext" }
