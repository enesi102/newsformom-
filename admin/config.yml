backend:
  name: git-gateway
  branch: main

media_folder: "news/images"
public_folder: "/news/images"

locale: "ro"

collections:
  - name: "news"
    label: "Știri"
    folder: "news"
    create: true
    extension: "json"
    format: "json"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:

      - label: "Titlu"
        name: "title"
        widget: "string"

      - label: "Data și ora publicării"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DDTHH:mm:ssZ"
        date_format: "DD.MM.YYYY"
        time_format: "HH:mm"

      - label: "Categorie"
        name: "category"
        widget: "select"
        options:
          - label: "🏗️ Construim"
            value: "construim"
          - label: "📚 Învățăm"
            value: "invatam"
          - label: "🔬 Cercetăm"
            value: "cercetam"

      - label: "Imagine principală"
        name: "image"
        widget: "image"
        required: false

      - label: "Cuvinte cheie"
        name: "tags"
        widget: "list"
        required: false
        field:
          label: "Cuvânt cheie"
          name: "tag"
          widget: "string"

      - label: "Conținut"
        name: "body"
        widget: "markdown"
        buttons:
          - bold
          - italic
          - link
          - bulleted-list
          - numbered-list
          - quote
          - heading-two
          - heading-three

      - label: "Galerie foto"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Fotografie"
          name: "image"
          widget: "image"

      - label: "Link articol original"
        name: "source_url"
        widget: "string"
        required: false
