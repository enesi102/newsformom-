<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NewsForMom — știri care merită înțelese.">
  <title>NewsForMom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/media/brand/quokka-zebra-logo.svg">
  <link rel="icon" type="image/png" href="/media/brand/site-icon-192.png">
  <link rel="apple-touch-icon" href="/media/brand/site-icon-192.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/" aria-label="NewsForMom home">
        <img class="brand-logo" src="/media/brand/quokka-zebra-logo.svg" alt="NewsForMom logo">
        <span class="brand-wordmark">NewsForMom</span>
      </a>
      <nav class="main-nav" aria-label="Navigare">
        <a href="#/">Articole</a>
        <a href="#/about">About</a>
        <a href="#/contact">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <div id="banner-root"></div>

    <section class="container page-shell">
      <div id="app"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>NewsForMom</span>
      <a href="#/about">Despre</a>
      <a href="#/contact">Contact</a>
    </div>
  </footer>

  <div id="lightbox" class="lightbox" hidden aria-modal="true" role="dialog">
    <button class="lightbox-close" aria-label="Închide">×</button>
    <button class="lightbox-prev" aria-label="Imaginea anterioară">‹</button>
    <div class="lightbox-content">
      <img id="lightbox-image" alt="">
      <div id="lightbox-caption"></div>
    </div>
    <button class="lightbox-next" aria-label="Imaginea următoare">›</button>
  </div>

  <script src="/app.js"></script>
</body>
</html>
