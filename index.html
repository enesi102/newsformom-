<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NewsForMom</title>
  <meta name="description" content="Știri și informații despre construim, învățăm și cercetăm.">

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    :root {
      --bg: #f8f8f6;
      --surface: #ffffff;
      --text: #202124;
      --muted: #737373;
      --border: #e8e8e5;
      --accent: #314b3d;
      --accent-light: #e8eee9;
      --max-width: 1080px;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      line-height: 1.6;
    }

    button {
      font: inherit;
    }

    /* HEADER */

    header {
      background: rgba(248, 248, 246, 0.96);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
      backdrop-filter: blur(10px);
    }

    .header-inner {
      max-width: var(--max-width);
      margin: auto;
      padding: 20px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      text-decoration: none;
      color: var(--text);
    }

    .brand-name {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .brand-subtitle {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      margin-top: -3px;
    }

    /* HERO */

    .hero {
      max-width: var(--max-width);
      margin: auto;
      padding: 58px 22px 30px;
    }

    .hero h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.1rem, 5vw, 3.5rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
      max-width: 700px;
      margin: 0 0 14px;
    }

    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      max-width: 650px;
      margin: 0;
    }

    /* FILTERS */

    .filters-wrapper {
      max-width: var(--max-width);
      margin: auto;
      padding: 10px 22px 30px;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filters::-webkit-scrollbar {
      display: none;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: #555;
      padding: 9px 17px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: #cfcfcb;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    /* FEED */

    #news-feed {
      max-width: var(--max-width);
      margin: auto;
      padding: 0 22px 70px;
    }

    .article {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 26px;
      overflow: hidden;
    }

    .article-image {
      width: 100%;
      max-height: 460px;
      object-fit: cover;
      display: block;
    }

    .article-content {
      padding: 30px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .category {
      display: inline-flex;
      align-items: center;
      padding: 4px 9px;
      border-radius: 999px;
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }

    .article h2 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.6rem, 3vw, 2.25rem);
      line-height: 1.2;
      letter-spacing: -0.025em;
      margin: 0 0 15px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .tag {
      color: #666;
      background: #f1f1ef;
      padding: 3px 9px;
      border-radius: 5px;
      font-size: 0.75rem;
    }

    /* ARTICLE BODY */

    .body-text {
      color: #3d3d3d;
      font-size: 1rem;
      line-height: 1.78;
    }

    .body-text p {
      margin: 0 0 1.1em;
    }

    .body-text h2,
    .body-text h3 {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--text);
      line-height: 1.25;
      margin: 1.7em 0 0.6em;
    }

    .body-text h2 {
      font-size: 1.5rem;
    }

    .body-text h3 {
      font-size: 1.25rem;
    }

    .body-text ul,
    .body-text ol {
      padding-left: 25px;
      margin-bottom: 1.2em;
    }

    .body-text blockquote {
      border-left: 3px solid var(--accent);
      margin: 25px 0;
      padding: 8px 20px;
      color: #666;
      font-style: italic;
      background: #fafafa;
    }

    .body-text a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .body-text img {
      max-width: 100%;
      border-radius: 12px;
      margin: 15px 0;
    }

    /* GALLERY */

    .gallery {
      margin-top: 34px;
      padding-top: 28px;
      border-top: 1px solid var(--border);
    }

    .gallery-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.35rem;
      margin: 0 0 15px;
    }

    .gallery-container {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      background: #111;
    }

    .gallery-image {
      display: block;
      width: 100%;
      height: 440px;
      object-fit: contain;
      cursor: zoom-in;
      background: #111;
    }

    .gallery-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #222;
      cursor: pointer;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gallery-btn:hover {
      background: white;
    }

    .gallery-prev {
      left: 14px;
    }

    .gallery-next {
      right: 14px;
    }

    .gallery-counter {
      position: absolute;
      right: 15px;
      bottom: 15px;
      background: rgba(0,0,0,0.65);
      color: white;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 0.78rem;
    }

    /* SOURCE */

    .source-link {
      display: inline-block;
      margin-top: 25px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    /* EMPTY / LOADING */

    .message {
      text-align: center;
      color: var(--muted);
      padding: 60px 10px;
    }

    /* FULLSCREEN LIGHTBOX */

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.94);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox-image {
      max-width: 92vw;
      max-height: 88vh;
      object-fit: contain;
      user-select: none;
    }

    .lightbox-close {
      position: fixed;
      top: 18px;
      right: 22px;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 2rem;
      cursor: pointer;
    }

    .lightbox-nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      color: white;
      font-size: 1.8rem;
      cursor: pointer;
    }

    .lightbox-prev {
      left: 20px;
    }

    .lightbox-next {
      right: 20px;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--border);
      color: var(--muted);
      text-align: center;
      padding: 30px 20px;
      font-size: 0.82rem;
    }

    /* MOBILE */

    @media (max-width: 650px) {
      .header-inner {
        padding: 16px;
      }

      .brand-name {
        font-size: 1.4rem;
      }

      .hero {
        padding: 40px 17px 25px;
      }

      .filters-wrapper {
        padding: 5px 17px 25px;
      }

      #news-feed {
        padding: 0 17px 50px;
      }

      .article-content {
        padding: 22px 19px;
      }

      .article-image {
        max-height: 300px;
      }

      .gallery-image {
        height: 280px;
      }

      .gallery-btn {
        width: 38px;
        height: 38px;
      }

      .lightbox {
        padding: 10px;
      }

      .lightbox-prev {
        left: 10px;
      }

      .lightbox-next {
        right: 10px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">
    <a href="/" class="brand">
      <span class="brand-name">NewsForMom</span>
      <span class="brand-subtitle">Știri care contează</span>
    </a>
  </div>
</header>

<section class="hero">
  <h1>Descoperim. Învățăm. Construim.</h1>
  <p>
    Informații, idei și descoperiri prezentate simplu și clar.
  </p>
</section>

<div class="filters-wrapper">
  <div class="filters">
    <button class="filter-btn active" data-category="all">
      Toate
    </button>

    <button class="filter-btn" data-category="construim">
      🏗️ Construim
    </button>

    <button class="filter-btn" data-category="invatam">
      📚 Învățăm
    </button>

    <button class="filter-btn" data-category="cercetam">
      🔬 Cercetăm
    </button>
  </div>
</div>

<main id="news-feed">
  <div class="message">Se încarcă știrile...</div>
</main>

<footer>
  © NewsForMom
</footer>

<!-- FULLSCREEN IMAGE VIEWER -->

<div class="lightbox" id="lightbox">

  <button class="lightbox-close" id="lightboxClose" aria-label="Închide">
    ×
  </button>

  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Imaginea anterioară">
    ‹
  </button>

  <img class="lightbox-image" id="lightboxImage" alt="">

  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Imaginea următoare">
    ›
  </button>

</div>

<script>

  const REPO_API =
    "https://api.github.com/repos/enesi102/newsformom-/contents/news";

  let allArticles = [];

  let lightboxImages = [];
  let lightboxIndex = 0;


  /* --------------------------------
     LOAD ARTICLES
  -------------------------------- */

  async function loadArticles() {

    const feed = document.getElementById("news-feed");

    try {

      const response = await fetch(REPO_API);

      if (!response.ok) {
        throw new Error("GitHub API error");
      }

      const files = await response.json();

      const jsonFiles = files.filter(
        file => file.name.toLowerCase().endsWith(".json")
      );

      const articles = await Promise.all(

        jsonFiles.map(async file => {

          const response = await fetch(file.download_url);

          if (!response.ok) return null;

          return await response.json();

        })

      );

      allArticles = articles
        .filter(Boolean)
        .sort(
          (a, b) =>
            new Date(b.date || 0) -
            new Date(a.date || 0)
        );

      renderArticles("all");

    } catch (error) {

      console.error(error);

      feed.innerHTML = `
        <div class="message">
          Nu am putut încărca știrile.
        </div>
      `;

    }

  }


  /* --------------------------------
     CATEGORY
  -------------------------------- */

  function categoryLabel(category) {

    const labels = {

      construim: "🏗️ Construim",

      invatam: "📚 Învățăm",

      cercetam: "🔬 Cercetăm"

    };

    return labels[category] || category;

  }


  /* --------------------------------
     DATE
  -------------------------------- */

  function formatDate(date) {

    if (!date) return "";

    return new Date(date).toLocaleDateString(
      "ro-RO",
      {
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );

  }


  /* --------------------------------
     TAGS
  -------------------------------- */

  function renderTags(tags) {

    if (!tags) return "";

    let tagArray = [];

    if (Array.isArray(tags)) {

      tagArray = tags;

    } else if (typeof tags === "string") {

      tagArray = tags
        .split(",")
        .map(t => t.trim())
        .filter(Boolean);

    }

    if (!tagArray.length) return "";

    return `
      <div class="tags">

        ${tagArray.map(tag => `
          <span class="tag">
            #${escapeHtml(tag)}
          </span>
        `).join("")}

      </div>
    `;

  }


  /* --------------------------------
     ESCAPE
  -------------------------------- */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  /* --------------------------------
     MARKDOWN
  -------------------------------- */

  function renderMarkdown(markdown) {

    if (!markdown) return "";

    const html = marked.parse(markdown);

    return DOMPurify.sanitize(html);

  }


  /* --------------------------------
     GALLERY
  -------------------------------- */

  function getGallery(article) {

    if (!Array.isArray(article.gallery)) {
      return [];
    }

    return article.gallery
      .map(item => {

        if (typeof item === "string") {
          return item;
        }

        if (item && item.image) {
          return item.image;
        }

        return null;

      })
      .filter(Boolean);

  }


  function renderGallery(images) {

    if (!images.length) return "";

    const id =
      "gallery-" +
      Math.random().toString(36).substring(2, 10);

    return `
      <div
        class="gallery"
        data-gallery="${id}"
        data-images='${JSON.stringify(images)}'
      >

        <h3 class="gallery-title">
          Galerie foto
        </h3>

        <div class="gallery-container">

          <img
            class="gallery-image"
            src="${escapeHtml(images[0])}"
            alt="Fotografie"
            loading="lazy"
            onclick="openLightbox('${id}', 0)"
          >

          ${
            images.length > 1
              ? `
                <button
                  class="gallery-btn gallery-prev"
                  onclick="changeGallery('${id}', -1)"
                  aria-label="Fotografia anterioară"
                >
                  ‹
                </button>

                <button
                  class="gallery-btn gallery-next"
                  onclick="changeGallery('${id}', 1)"
                  aria-label="Fotografia următoare"
                >
                  ›
                </button>

                <div class="gallery-counter">
                  <span class="gallery-current">1</span>
                  /
                  ${images.length}
                </div>
              `
              : ""
          }

        </div>

      </div>
    `;

  }


  function changeGallery(id, direction) {

    const gallery =
      document.querySelector(
        `[data-gallery="${id}"]`
      );

    if (!gallery) return;

    const images =
      JSON.parse(gallery.dataset.images);

    let current =
      Number(
        gallery.dataset.current || 0
      );

    current += direction;

    if (current < 0) {
      current = images.length - 1;
    }

    if (current >= images.length) {
      current = 0;
    }

    gallery.dataset.current = current;

    const image =
      gallery.querySelector(".gallery-image");

    image.src = images[current];

    const counter =
      gallery.querySelector(".gallery-current");

    if (counter) {
      counter.textContent = current + 1;
    }

  }


  /* --------------------------------
     LIGHTBOX
  -------------------------------- */

  function openLightbox(id, index) {

    const gallery =
      document.querySelector(
        `[data-gallery="${id}"]`
      );

    if (!gallery) return;

    lightboxImages =
      JSON.parse(gallery.dataset.images);

    lightboxIndex = index;

    updateLightbox();

    document
      .getElementById("lightbox")
      .classList.add("open");

    document.body.style.overflow = "hidden";

  }


  function updateLightbox() {

    const image =
      document.getElementById("lightboxImage");

    image.src =
      lightboxImages[lightboxIndex];

    image.alt =
      `Fotografie ${lightboxIndex + 1}`;

  }


  function closeLightbox() {

    document
      .getElementById("lightbox")
      .classList.remove("open");

    document.body.style.overflow = "";

  }


  function nextLightbox() {

    if (!lightboxImages.length) return;

    lightboxIndex =
      (lightboxIndex + 1) %
      lightboxImages.length;

    updateLightbox();

  }


  function previousLightbox() {

    if (!lightboxImages.length) return;

    lightboxIndex--;

    if (lightboxIndex < 0) {
      lightboxIndex =
        lightboxImages.length - 1;
    }

    updateLightbox();

  }


  document
    .getElementById("lightboxClose")
    .addEventListener(
      "click",
      closeLightbox
    );

  document
    .getElementById("lightboxNext")
    .addEventListener(
      "click",
      nextLightbox
    );

  document
    .getElementById("lightboxPrev")
    .addEventListener(
      "click",
      previousLightbox
    );


  document
    .getElementById("lightbox")
    .addEventListener(
      "click",
      event => {

        if (
          event.target.id === "lightbox"
        ) {
          closeLightbox();
        }

      }
    );


  document.addEventListener(
    "keydown",
    event => {

      const lightbox =
        document.getElementById("lightbox");

      if (!lightbox.classList.contains("open")) {
        return;
      }

      if (event.key === "Escape") {
        closeLightbox();
      }

      if (event.key === "ArrowRight") {
        nextLightbox();
      }

      if (event.key === "ArrowLeft") {
        previousLightbox();
      }

    }
  );


  /* --------------------------------
     ARTICLES
  -------------------------------- */

  function renderArticles(category) {

    const feed =
      document.getElementById("news-feed");

    const filtered =
      category === "all"
        ? allArticles
        : allArticles.filter(
            article =>
              article.category === category
          );

    if (!filtered.length) {

      feed.innerHTML = `
        <div class="message">
          Nu există știri în această categorie.
        </div>
      `;

      return;

    }

    feed.innerHTML =
      filtered.map(article => {

        const gallery =
          getGallery(article);

        return `

          <article class="article">

            ${
              article.image
                ? `
                  <img
                    class="article-image"
                    src="${escapeHtml(article.image)}"
                    alt="${escapeHtml(article.title || "")}"
                    loading="lazy"
                  >
                `
                : ""
            }

            <div class="article-content">

              <div class="meta">

                ${
                  article.category
                    ? `
                      <span class="category">
                        ${categoryLabel(article.category)}
                      </span>
                    `
                    : ""
                }

                <span>
                  ${formatDate(article.date)}
                </span>

              </div>

              <h2>
                ${escapeHtml(article.title || "")}
              </h2>

              ${renderTags(article.tags)}

              <div class="body-text">
                ${renderMarkdown(article.body)}
              </div>

              ${renderGallery(gallery)}

              ${
                article.source_url
                  ? `
                    <a
                      class="source-link"
                      href="${escapeHtml(article.source_url)}"
                      target="_blank"
                      rel="noopener noreferrer"
                    >
                      Citește articolul original ↗
                    </a>
                  `
                  : ""
              }

            </div>

          </article>

        `;

      }).join("");

  }


  /* --------------------------------
     FILTER BUTTONS
  -------------------------------- */

  document
    .querySelectorAll(".filter-btn")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(".filter-btn")
            .forEach(btn =>
              btn.classList.remove("active")
            );

          button.classList.add("active");

          renderArticles(
            button.dataset.category
          );

          window.scrollTo({
            top: 250,
            behavior: "smooth"
          });

        }
      );

    });


  /* START */

  loadArticles();

</script>

</body>
</html>
