<!DOCTYPE html>
<html lang="ro">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NewsForMom</title>

<meta
  name="description"
  content="NewsForMom — știri care contează."
>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>

:root {
  --background: #f8faf8;
  --surface: #ffffff;
  --text: #202522;
  --muted: #717873;
  --border: #e5e9e5;
  --green: #3d6950;
  --green-light: #eaf2ec;
  --highlight: #fff0a8;
  --max: 1080px;
  --radius: 18px;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;
  line-height: 1.65;
}

a {
  color: inherit;
}

button,
input,
select {
  font: inherit;
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 30;
  background: rgba(248,250,248,.94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.header-inner {
  max-width: var(--max);
  margin: auto;
  padding: 17px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  text-decoration: none;
}

.logo-name {
  display: block;
  font-family: Georgia, serif;
  font-size: 1.55rem;
  font-weight: 700;
  letter-spacing: -.04em;
}

.logo-subtitle {
  color: var(--muted);
  font-size: .72rem;
}

nav {
  display: flex;
  gap: 22px;
}

nav a {
  color: var(--muted);
  text-decoration: none;
  font-size: .9rem;
}

nav a:hover {
  color: var(--green);
}

/* HERO */

.hero {
  max-width: var(--max);
  margin: auto;
  padding: 60px 22px 35px;
}

.hero h1 {
  max-width: 720px;
  margin: 0;
  font-family: Georgia, serif;
  font-size: clamp(2.3rem, 6vw, 4rem);
  line-height: 1.05;
  letter-spacing: -.05em;
}

.hero p {
  max-width: 650px;
  margin: 18px 0 0;
  color: var(--muted);
  font-size: 1.05rem;
}

/* SEARCH */

.search-area {
  max-width: var(--max);
  margin: auto;
  padding: 0 22px 25px;
}

.search-box {
  display: flex;
  gap: 10px;
}

.search-input {
  flex: 1;
  min-width: 0;
  padding: 13px 17px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
  outline: none;
}

.search-input:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px var(--green-light);
}

.search-type {
  padding: 0 13px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: white;
}

/* FILTERS */

.filters {
  max-width: var(--max);
  margin: auto;
  padding: 0 22px 35px;
  display: flex;
  gap: 8px;
  overflow-x: auto;
}

.filter {
  border: 1px solid var(--border);
  background: white;
  color: var(--muted);
  padding: 8px 16px;
  border-radius: 999px;
  white-space: nowrap;
  cursor: pointer;
}

.filter.active,
.filter:hover {
  background: var(--green);
  border-color: var(--green);
  color: white;
}

/* CONTENT */

main {
  max-width: var(--max);
  margin: auto;
  padding: 0 22px 80px;
}

.section-heading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 18px;
}

.section-heading h2 {
  font-family: Georgia, serif;
  margin: 0;
  font-size: 1.55rem;
}

.result-count {
  color: var(--muted);
  font-size: .82rem;
}

/* ARTICLE CARD */

.article-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 24px;
  transition:
    transform .2s ease,
    box-shadow .2s ease;
}

.article-card:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(30,50,35,.07);
}

.article-image {
  width: 100%;
  height: 330px;
  object-fit: cover;
  display: block;
}

.article-card-content {
  padding: 27px;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  color: var(--muted);
  font-size: .8rem;
  margin-bottom: 10px;
}

.category {
  background: var(--green-light);
  color: var(--green);
  border-radius: 999px;
  padding: 4px 9px;
  font-weight: 600;
}

.article-title {
  margin: 0 0 12px;
  font-family: Georgia, serif;
  font-size: clamp(1.55rem, 4vw, 2.2rem);
  line-height: 1.2;
  letter-spacing: -.03em;
}

.article-title a {
  text-decoration: none;
}

.article-title a:hover {
  color: var(--green);
}

.excerpt {
  color: #4e5550;
}

.read-more {
  display: inline-block;
  margin-top: 12px;
  color: var(--green);
  text-decoration: none;
  font-weight: 600;
  font-size: .9rem;
}

/* ARTICLE PAGE */

.article-page {
  max-width: 820px;
  margin: auto;
  padding: 55px 22px 90px;
}

.article-page h1 {
  font-family: Georgia, serif;
  font-size: clamp(2.2rem, 6vw, 4rem);
  line-height: 1.08;
  letter-spacing: -.045em;
  margin: 12px 0 20px;
}

.article-page .hero-image {
  width: 100%;
  max-height: 570px;
  object-fit: cover;
  border-radius: 18px;
  margin: 25px 0 35px;
}

.article-body {
  font-size: 1.06rem;
  line-height: 1.82;
}

.article-body h2,
.article-body h3 {
  font-family: Georgia, serif;
  line-height: 1.25;
  margin-top: 2em;
}

.article-body img {
  max-width: 100%;
  border-radius: 12px;
}

.article-body blockquote {
  border-left: 3px solid var(--green);
  margin: 28px 0;
  padding: 10px 20px;
  background: #f7f9f7;
  color: var(--muted);
}

/* TAGS */

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 16px 0;
}

.tag {
  background: #f0f2f0;
  border-radius: 6px;
  padding: 3px 8px;
  color: var(--muted);
  font-size: .75rem;
}

/* SEARCH HIGHLIGHT */

mark {
  background: var(--highlight);
  color: inherit;
  padding: 0 2px;
  border-radius: 2px;
}

/* GALLERY */

.gallery {
  margin-top: 45px;
  padding-top: 30px;
  border-top: 1px solid var(--border);
}

.gallery h3 {
  font-family: Georgia, serif;
}

.gallery-container {
  position: relative;
  background: #111;
  border-radius: 16px;
  overflow: hidden;
}

.gallery-image {
  width: 100%;
  height: 460px;
  object-fit: contain;
  display: block;
  cursor: zoom-in;
}

.gallery-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: rgba(255,255,255,.9);
  cursor: pointer;
  font-size: 1.6rem;
}

.gallery-prev {
  left: 14px;
}

.gallery-next {
  right: 14px;
}

.gallery-counter {
  position: absolute;
  right: 14px;
  bottom: 14px;
  background: rgba(0,0,0,.65);
  color: white;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: .75rem;
}

/* LIGHTBOX */

.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(10,12,11,.95);
  align-items: center;
  justify-content: center;
}

.lightbox.open {
  display: flex;
}

.lightbox img {
  max-width: 94vw;
  max-height: 90vh;
  object-fit: contain;
}

.lightbox-close,
.lightbox-prev,
.lightbox-next {
  position: fixed;
  border: 0;
  background: rgba(255,255,255,.12);
  color: white;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  cursor: pointer;
  font-size: 1.8rem;
}

.lightbox-close {
  right: 20px;
  top: 20px;
}

.lightbox-prev {
  left: 20px;
  top: 50%;
}

.lightbox-next {
  right: 20px;
  top: 50%;
}

/* ABOUT / CONTACT */

.info-page {
  max-width: 760px;
  margin: auto;
  padding: 65px 22px 90px;
}

.info-page h1 {
  font-family: Georgia, serif;
  font-size: 3rem;
  line-height: 1.1;
}

.info-body {
  font-size: 1.08rem;
  line-height: 1.85;
}

.email {
  color: var(--green);
  font-weight: 600;
}

/* FOOTER */

footer {
  border-top: 1px solid var(--border);
  padding: 35px 22px 100px;
  text-align: center;
  color: var(--muted);
  font-size: .82rem;
}

.footer-links {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 12px;
}

.footer-links a {
  text-decoration: none;
}

.footer-links a:hover {
  color: var(--green);
}

/* HATCHING BADGE */

.hatching {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 50;
  background: #4d8b62;
  color: white;
  border-radius: 14px;
  padding: 11px 15px;
  box-shadow: 0 8px 25px rgba(30,70,40,.18);
  font-size: .78rem;
  line-height: 1.25;
}

.hatching strong {
  display: block;
}

/* MOBILE */

@media (max-width: 650px) {

  nav {
    gap: 12px;
  }

  nav a {
    font-size: .8rem;
  }

  .hero {
    padding: 45px 17px 28px;
  }

  .search-area,
  .filters,
  main {
    padding-left: 17px;
    padding-right: 17px;
  }

  .search-box {
    flex-direction: column;
  }

  .search-type {
    height: 44px;
  }

  .article-image {
    height: 250px;
  }

  .article-card-content {
    padding: 21px;
  }

  .gallery-image {
    height: 280px;
  }

  .hatching {
    right: 10px;
    bottom: 10px;
    font-size: .7rem;
    padding: 9px 11px;
  }

}

</style>
</head>

<body>

<header>

  <div class="header-inner">

    <a class="logo" href="#/">
      <span class="logo-name">NewsForMom</span>
      <span class="logo-subtitle">Știri care contează</span>
    </a>

    <nav>
      <a href="#/about">Despre</a>
      <a href="#/contact">Contact</a>
    </nav>

  </div>

</header>

<div id="app"></div>

<footer>

  <div class="footer-links">
    <a href="#/about">Despre NewsForMom</a>
    <a href="#/contact">Contact</a>
  </div>

  © NewsForMom

</footer>

<div class="hatching">
  <strong>🐣 Imediat eclozăm!</strong>
  Revino curând!
</div>

<div class="lightbox" id="lightbox">

  <button class="lightbox-close" onclick="closeLightbox()">×</button>

  <button
    class="lightbox-prev"
    onclick="previousLightbox()"
  >
    ‹
  </button>

  <img id="lightboxImage" alt="">

  <button
    class="lightbox-next"
    onclick="nextLightbox()"
  >
    ›
  </button>

</div>

<script>

const API =
  "https://api.github.com/repos/enesi102/newsformom-/contents/";

let articles = [];
let categories = [];
let pages = {};

let currentGallery = [];
let currentGalleryIndex = 0;


/* =========================
   DATA
========================= */

async function getJSON(path) {

  const response =
    await fetch(API + path);

  if (!response.ok) {
    throw new Error(path);
  }

  const files =
    await response.json();

  return files;

}


async function loadData() {

  try {

    const newsFiles =
      await getJSON("news");

    const categoryFiles =
      await getJSON("categories");

    const newsJson =
      newsFiles.filter(
        x => x.name.endsWith(".json")
      );

    const catJson =
      categoryFiles.filter(
        x => x.name.endsWith(".json")
      );

    articles =
      await Promise.all(
        newsJson.map(
          x => fetch(x.download_url)
            .then(r => r.json())
        )
      );

    categories =
      await Promise.all(
        catJson.map(
          x => fetch(x.download_url)
            .then(r => r.json())
        )
      );

    articles.sort(
      (a,b) =>
        new Date(b.date || 0) -
        new Date(a.date || 0)
    );

    render();

  } catch (error) {

    console.error(error);

    document.getElementById("app").innerHTML =
      `<div class="info-page">
        <h1>NewsForMom</h1>
        <p>Momentan nu am putut încărca informațiile.</p>
      </div>`;

  }

}


/* =========================
   HELPERS
========================= */

function category(slug) {

  return categories.find(
    x => x.slug === slug
  );

}


function formatDate(date) {

  if (!date) return "";

  return new Date(date)
    .toLocaleDateString(
      "ro-RO",
      {
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );

}


function escapeHTML(value) {

  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function renderMarkdown(value) {

  if (!value) return "";

  return DOMPurify.sanitize(
    marked.parse(value)
  );

}


function articleGallery(article) {

  if (!Array.isArray(article.gallery))
    return [];

  return article.gallery
    .map(item =>
      typeof item === "string"
        ? item
        : item?.image
    )
    .filter(Boolean);

}


function categoryName(slug) {

  const c = category(slug);

  if (!c)
    return slug || "";

  return `${c.icon || ""} ${c.name}`;

}


/* =========================
   HOME
========================= */

function renderHome() {

  const params =
    new URLSearchParams(
      location.hash.split("?")[1] || ""
    );

  const search =
    params.get("q") || "";

  const searchType =
    params.get("type") || "all";

  const cat =
    params.get("category") || "all";

  let results =
    cat === "all"
      ? [...articles]
      : articles.filter(
          x => x.category === cat
        );

  if (search) {

    const needle =
      search.toLowerCase();

    results =
      results.filter(article => {

        const title =
          String(article.title || "")
            .toLowerCase();

        const body =
          String(article.body || "")
            .toLowerCase();

        const tags =
          Array.isArray(article.tags)
            ? article.tags.join(" ").toLowerCase()
            : "";

        if (searchType === "title")
          return title.includes(needle);

        if (searchType === "body")
          return body.includes(needle);

        if (searchType === "tags")
          return tags.includes(needle);

        return (
          title.includes(needle) ||
          body.includes(needle) ||
          tags.includes(needle)
        );

      });

  }

  const app =
    document.getElementById("app");

  app.innerHTML = `

    <section class="hero">

      <h1>
        Descoperim.<br>
        Învățăm. Construim.
      </h1>

      <p>
        Știri și idei prezentate simplu,
        clar și cu grijă pentru ceea ce contează.
      </p>

    </section>

    <section class="search-area">

      <form
        class="search-box"
        onsubmit="performSearch(event)"
      >

        <input
          id="searchInput"
          class="search-input"
          type="search"
          placeholder="Caută știri..."
          value="${escapeHTML(search)}"
        >

        <select
          id="searchType"
          class="search-type"
        >

          <option value="all"
            ${searchType === "all" ? "selected" : ""}>
            Titlu + conținut
          </option>

          <option value="title"
            ${searchType === "title" ? "selected" : ""}>
            Titlu
          </option>

          <option value="body"
            ${searchType === "body" ? "selected" : ""}>
            Conținut
          </option>

          <option value="tags"
            ${searchType === "tags" ? "selected" : ""}>
            Cuvinte-cheie
          </option>

        </select>

      </form>

    </section>

    <section class="filters">

      <button
        class="filter ${cat === "all" ? "active" : ""}"
        onclick="filterCategory('all')"
      >
        Toate
      </button>

      ${categories.map(c => `

        <button
          class="filter ${cat === c.slug ? "active" : ""}"
          onclick="filterCategory('${escapeHTML(c.slug)}')"
        >
          ${escapeHTML(c.icon || "")}
          ${escapeHTML(c.name)}
        </button>

      `).join("")}

    </section>

    <main>

      <div class="section-heading">

        <h2>
          ${search ? "Rezultatele căutării" : "Ultimele știri"}
        </h2>

        <span class="result-count">
          ${results.length}
          ${results.length === 1 ? "rezultat" : "rezultate"}
        </span>

      </div>

      ${

        results.length

        ? results.map(
            articleCard
          ).join("")

        : `
          <div class="info-page">
            <p>
              Nu am găsit știri care să corespundă căutării.
            </p>
          </div>
        `

      }

    </main>
  `;

}


function articleCard(article) {

  const params =
    new URLSearchParams(
      location.hash.split("?")[1] || ""
    );

  const search =
    params.get("q") || "";

  const title =
    highlight(
      escapeHTML(article.title || ""),
      search
    );

  const excerpt =
    getExcerpt(
      article.body || "",
      search
    );

  return `

    <article class="article-card">

      ${
        article.image
          ? `
            <img
              class="article-image"
              src="${escapeHTML(article.image)}"
              alt="${escapeHTML(article.title)}"
              loading="lazy"
            >
          `
          : ""
      }

      <div class="article-card-content">

        <div class="meta">

          <span class="category">
            ${escapeHTML(
              categoryName(article.category)
            )}
          </span>

          <span>
            ${formatDate(article.date)}
          </span>

        </div>

        <h2 class="article-title">

          <a href="#/news/${encodeURIComponent(
            slugify(article.title)
          )}">
            ${title}
          </a>

        </h2>

        ${
          article.tags?.length
            ? `
              <div class="tags">
                ${
                  article.tags.map(
                    tag =>
                      `<span class="tag">
                        #${escapeHTML(tag)}
                      </span>`
                  ).join("")
                }
              </div>
            `
            : ""
        }

        <div class="excerpt">
          ${highlight(
            escapeHTML(excerpt),
            search
          )}
        </div>

        <a
          class="read-more"
          href="#/news/${encodeURIComponent(
            slugify(article.title)
          )}"
        >
          Citește articolul →
        </a>

      </div>

    </article>

  `;

}


function slugify(text) {

  return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-|-$/g,"");

}


function getExcerpt(text, search) {

  const plain =
    text
      .replace(/[#*_>`[\]]/g,"")
      .replace(/\n+/g," ")
      .trim();

  if (!search)
    return plain.substring(0,300) +
      (plain.length > 300 ? "…" : "");

  const index =
    plain.toLowerCase()
      .indexOf(search.toLowerCase());

  if (index < 0)
    return plain.substring(0,300);

  const start =
    Math.max(0,index - 100);

  return (
    (start > 0 ? "…" : "") +
    plain.substring(start,start + 300) +
    (start + 300 < plain.length ? "…" : "")
  );

}


function highlight(text, query) {

  if (!query)
    return text;

  const escaped =
    query.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );

  return text.replace(
    new RegExp(`(${escaped})`, "gi"),
    "<mark>$1</mark>"
  );

}


/* =========================
   ARTICLE
========================= */

function renderArticle(slug) {

  const article =
    articles.find(
      x =>
        slugify(x.title) === slug
    );

  if (!article) {

    document.getElementById("app").innerHTML =
      `<div class="info-page">
        <h1>Articolul nu a fost găsit</h1>
        <a href="#/">← Înapoi la știri</a>
      </div>`;

    return;

  }

  const gallery =
    articleGallery(article);

  document.getElementById("app").innerHTML = `

    <article class="article-page">

      <div class="meta">

        <span class="category">
          ${escapeHTML(
            categoryName(article.category)
          )}
        </span>

        <span>
          ${formatDate(article.date)}
        </span>

      </div>

      <h1>
        ${escapeHTML(article.title)}
      </h1>

      ${
        article.image
          ? `
            <img
              class="hero-image"
              src="${escapeHTML(article.image)}"
              alt="${escapeHTML(article.title)}"
            >
          `
          : ""
      }

      ${
        article.tags?.length
          ? `
            <div class="tags">
              ${
                article.tags.map(
                  tag =>
                    `<span class="tag">
                      #${escapeHTML(tag)}
                    </span>`
                ).join("")
              }
            </div>
          `
          : ""
      }

      <div class="article-body">
        ${renderMarkdown(article.body)}
      </div>

      ${
        gallery.length
          ? renderGallery(gallery)
          : ""
      }

      ${
        article.source_url
          ? `
            <p>
              <a
                class="read-more"
                href="${escapeHTML(article.source_url)}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Citește articolul original ↗
              </a>
            </p>
          `
          : ""
      }

      <p>
        <a class="read-more" href="#/">
          ← Înapoi la ultimele știri
        </a>
      </p>

    </article>

  `;

}


/* =========================
   GALLERY
========================= */

function renderGallery(images) {

  return `

    <section class="gallery">

      <h3>Galerie foto</h3>

      <div class="gallery-container">

        <img
          id="galleryImage"
          class="gallery-image"
          src="${escapeHTML(images[0])}"
          onclick="openLightbox(0)"
          alt="Galerie foto"
        >

        ${
          images.length > 1
            ? `
              <button
                class="gallery-button gallery-prev"
                onclick="changeGallery(-1)"
              >
                ‹
              </button>

              <button
                class="gallery-button gallery-next"
                onclick="changeGallery(1)"
              >
                ›
              </button>

              <div class="gallery-counter">
                <span id="galleryCounter">1</span>
                / ${images.length}
              </div>
            `
            : ""
        }

      </div>

    </section>
  `;

}


function openLightbox(index) {

  currentGalleryIndex = index;

  const article =
    articles.find(
      x =>
        location.hash.includes(
          slugify(x.title)
        )
    );

  if (!article)
    return;

  currentGallery =
    articleGallery(article);

  updateLightbox();

  document
    .getElementById("lightbox")
    .classList.add("open");

  document.body.style.overflow = "hidden";

}


function updateLightbox() {

  document.getElementById(
    "lightboxImage"
  ).src =
    currentGallery[currentGalleryIndex];

}


function closeLightbox() {

  document
    .getElementById("lightbox")
    .classList.remove("open");

  document.body.style.overflow = "";

}


function nextLightbox() {

  currentGalleryIndex =
    (currentGalleryIndex + 1) %
    currentGallery.length;

  updateLightbox();

}


function previousLightbox() {

  currentGalleryIndex--;

  if (currentGalleryIndex < 0)
    currentGalleryIndex =
      currentGallery.length - 1;

  updateLightbox();

}


function changeGallery(direction) {

  const article =
    articles.find(
      x =>
        location.hash.includes(
          slugify(x.title)
        )
    );

  if (!article)
    return;

  const images =
    articleGallery(article);

  currentGalleryIndex += direction;

  if (currentGalleryIndex < 0)
    currentGalleryIndex =
      images.length - 1;

  if (currentGalleryIndex >= images.length)
    currentGalleryIndex = 0;

  const image =
    document.getElementById(
      "galleryImage"
    );

  image.src =
    images[currentGalleryIndex];

  const counter =
    document.getElementById(
      "galleryCounter"
    );

  if (counter)
    counter.textContent =
      currentGalleryIndex + 1;

}


/* =========================
   SEARCH
========================= */

function performSearch(event) {

  event.preventDefault();

  const q =
    document.getElementById(
      "searchInput"
    ).value.trim();

  const type =
    document.getElementById(
      "searchType"
    ).value;

  if (!q) {

    location.hash = "#/";

    return;

  }

  location.hash =
    `/?q=${encodeURIComponent(q)}&type=${type}`;

}


function filterCategory(category) {

  if (category === "all") {

    location.hash = "#/";

  } else {

    location.hash =
      `/?category=${encodeURIComponent(category)}`;

  }

}


/* =========================
   ABOUT / CONTACT
========================= */

async function renderAbout() {

  try {

    const response =
      await fetch(
        API + "content/about.json"
      );

    const about =
      await response.json();

    document.getElementById("app").innerHTML = `

      <section class="info-page">

        <h1>
          ${escapeHTML(about.title)}
        </h1>

        <div class="info-body">
          ${renderMarkdown(about.body)}
        </div>

      </section>

    `;

  } catch {

    renderError();

  }

}


async function renderContact() {

  try {

    const response =
      await fetch(
        API + "content/contact.json"
      );

    const contact =
      await response.json();

    document.getElementById("app").innerHTML = `

      <section class="info-page">

        <h1>Contact</h1>

        <div class="info-body">

          ${renderMarkdown(contact.body)}

          <p>
            <a
              class="email"
              href="mailto:${escapeHTML(contact.email)}"
            >
              ${escapeHTML(contact.email)}
            </a>
          </p>

        </div>

      </section>

    `;

  } catch {

    renderError();

  }

}


function renderError() {

  document.getElementById("app").innerHTML =
    `<section class="info-page">
      <h1>NewsForMom</h1>
      <p>Pagina nu este disponibilă momentan.</p>
    </section>`;

}


/* =========================
   ROUTER
========================= */

function render() {

  const hash =
    location.hash || "#/";

  if (hash === "#/about") {

    renderAbout();

    return;

  }

  if (hash === "#/contact") {

    renderContact();

    return;

  }

  if (hash.startsWith("#/news/")) {

    const slug =
      decodeURIComponent(
        hash.substring(7).split("?")[0]
      );

    renderArticle(slug);

    return;

  }

  renderHome();

}


window.addEventListener(
  "hashchange",
  render
);


/* KEYBOARD */

document.addEventListener(
  "keydown",
  event => {

    if (
      !document
        .getElementById("lightbox")
        .classList.contains("open")
    )
      return;

    if (event.key === "Escape")
      closeLightbox();

    if (event.key === "ArrowRight")
      nextLightbox();

    if (event.key === "ArrowLeft")
      previousLightbox();

  }
);


/* START */

loadData();

</script>
